<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Conheça os projetos criados por Sillas, incluindo ferramentas para jogadores de Yu-Gi-Oh!." />
    <link rel="canonical" href="https://sillashead.github.io/" />
    <link rel="icon" type="image/png" sizes="512x512" href="/yugioh-lp/favicon.png" />
    <title>Projetos do Sillas</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "url": "https://sillashead.github.io/",
        "name": "Projetos do Sillas"
      }
    </script>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #141613; color: #eee9dc; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(ellipse at center, #292b27, #111310 75%); }
      main { width: min(100%, 560px); padding: clamp(24px, 6vw, 48px); border: 1px solid #80652d; border-radius: 18px; text-align: center; background: #1d1f1c; box-shadow: 0 20px 60px #0008; }
      img { display: block; width: min(70%, 220px); height: auto; margin: 0 auto 16px; }
      h1 { margin: 0 0 16px; color: #e2bd66; font-size: clamp(1.7rem, 5vw, 2.5rem); line-height: 1.15; }
      h2 { margin: 0 0 12px; color: #eee9dc; font-size: 1.3rem; }
      p { color: #d0d0c9; line-height: 1.6; }
      a { display: inline-block; margin-top: 12px; padding: 12px 20px; border: 1px solid #a9843d; border-radius: 8px; color: #17150f; background: #e2bd66; font-weight: 700; text-decoration: none; }
      a:hover { background: #f0d486; }
    </style>
  </head>
  <body>
    <main>
      <h1>Projetos do Sillas</h1>
      <p>Conheça meus projetos e ferramentas.</p>
      <section aria-labelledby="lp-counter-title">
        <img src="/yugioh-lp/favicon.png" alt="Contador de Life Points com 8000 LP" width="512" height="512" />
        <h2 id="lp-counter-title">Yu-Gi-Oh! LP Counter &amp; Tracker</h2>
        <p>Contador de Life Points para dois jogadores, com dano, cura, moeda e dado.</p>
        <a href="/yugioh-lp/">Abrir o contador</a>
      </section>
    </main>
  </body>
</html>
